name: Schedule probe

# Temporary: shows whether any schedule fires in this repository. Delete after the test.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Fired by ${{ github.event_name }} at $(date -u +%H:%M) UTC"
